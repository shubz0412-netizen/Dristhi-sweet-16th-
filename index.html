<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Dristhika! ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #ffb6c1, #ff8fab);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            text-align: center;
            color: #d81b60;
            padding: 20px;
        }

        /* =========================
           FLOATING HEARTS
        ========================= */

        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            color: #ff4081;
            animation: floatUp 6s linear forwards;
            z-index: 1;
            pointer-events: none;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(0.5);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) translateX(100px) scale(1.2);
                opacity: 0;
            }
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            max-width: 650px;
            width: 100%;
            background: rgba(255, 255, 255, 0.88);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.15);
            z-index: 10;
            backdrop-filter: blur(8px);
            margin: 20px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }

            100% {
                transform: scale(1);
            }
        }

        /* =========================
           OPENING SCREEN
        ========================= */

        .music-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #ffb6c1, #ff4081);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .music-prompt h1 {
            color: white;
            font-size: 2.2rem;
            max-width: 600px;
        }

        .start-btn {
            background-color: #d81b60;
            color: white;
            border: none;
            padding: 16px 42px;
            font-size: 1.2rem;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.25);
            font-weight: bold;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.05);
        }

        /* =========================
           COUPLE PHOTO
        ========================= */

        .couple-img {
            width: 80%;
            max-width: 300px;
            border-radius: 15px;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        /* =========================
           CAKE SECTION
        ========================= */

        .cake-section {
            margin: 30px 0;
        }

        .hot-text {
            font-size: 2rem;
            font-weight: bold;
            color: #e91e63;
            margin-bottom: 15px;
            animation: hotPulse 1.5s infinite;
        }

        @keyframes hotPulse {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        .cake {
            font-size: 5rem;
            position: relative;
            display: inline-block;
            margin-top: 5px;
        }

        .candles-container {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            gap: 2px;
            margin-bottom: -15px;
            flex-wrap: wrap;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .candle {
            font-size: 1.5rem;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .candle.blown {
            opacity: 0;
            transform: translateY(-15px) scale(0.5);
        }

        .blow-instruction {
            font-size: 1rem;
            font-style: italic;
            margin-top: 15px;
            color: #880e4f;
            background: #ffebee;
            padding: 8px 18px;
            border-radius: 20px;
            display: inline-block;
        }

        .mic-status {
            margin-top: 12px;
            font-size: 0.9rem;
            color: #777;
        }

        /* =========================
           GIFT
        ========================= */

        .gift-section {
            display: none;
            margin-top: 30px;
            animation: fadeIn 1s ease forwards;
        }

        .gift-title {
            font-size: 2rem;
            color: #d81b60;
            margin-bottom: 10px;
        }

        .gift-box {
            font-size: 6rem;
            cursor: pointer;
            transition: transform 0.3s;
            animation: bounce 2s infinite;
            display: inline-block;
        }

        .gift-box:hover {
            transform: scale(1.1);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        /* =========================
           SURPRISE
        ========================= */

        .surprise-reveal {
            display: none;
            animation: fadeIn 1.5s ease forwards;
        }

        .teddy-img {
            width: 70%;
            max-width: 300px;
            margin-top: 20px;
            border-radius: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .heartfelt-message {
            font-size: 1.3rem;
            line-height: 1.6;
            margin-top: 25px;
            padding: 18px;
            background: #fff;
            border-radius: 15px;
            border-left: 5px solid #d81b60;
            color: #ad1457;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes popIn {
            from {
                transform: scale(0) rotate(-10deg);
                opacity: 0;
            }

            to {
                transform: scale(1) rotate(0);
                opacity: 1;
            }
        }

        /* =========================
           CONFETTI
        ========================= */

        .confetti {
            position: fixed;
            top: -20px;
            width: 10px;
            height: 15px;
            z-index: 9998;
            pointer-events: none;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .hot-text {
                font-size: 1.6rem;
            }

            .cake {
                font-size: 4.5rem;
            }

            .candle {
                font-size: 1.25rem;
            }

            .heartfelt-message {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         OPENING SCREEN
    ========================== -->

    <div class="music-prompt" id="musicPrompt">

        <h1>
            Open Dristhika's Birthday Surprise ❤️
        </h1>

        <button class="start-btn" onclick="startExperience()">
            Click to Enter 💖
        </button>

    </div>


    <!-- =========================
         BACKGROUND MUSIC
    ========================== -->

    <audio id="bgMusic" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>


    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <div class="container">

        <h1>
            Happy Birthday to my favorite person in the whole world! 💖
        </h1>


        <!-- COUPLE PHOTO -->

        <img
            src="us.jpg"
            alt="Us"
            class="couple-img"
        >


        <!-- =========================
             CAKE
        ========================== -->

        <div class="cake-section" id="cakeSection">

            <div class="hot-text">
                🔥 16 TIME HOTTER 🔥
            </div>

            <div class="candles-container" id="candlesContainer">
                <!-- 16 candles generated by JavaScript -->
            </div>

            <div class="cake">
                🎂
            </div>

            <br>

            <span class="blow-instruction" id="blowButton">
                💨 Blow on your phone to blow out the candles!
            </span>

            <div class="mic-status" id="micStatus">
                Microphone is starting...
            </div>

        </div>


        <!-- =========================
             GIFT
        ========================== -->

        <div class="gift-section" id="giftSection">

            <div class="gift-title">
                For Youz ❤️
            </div>

            <p>
                I got something for you... 👀
            </p>

            <div
                class="gift-box"
                onclick="openGift()"
            >
                🎁
            </div>

        </div>


        <!-- =========================
             FINAL SURPRISE
        ========================== -->

        <div class="surprise-reveal" id="surpriseReveal">

            <!-- YOUR BEAR IMAGE -->
            <img
                src="teddy.webp"
                alt="Your Bear"
                class="teddy-img"
            >

            <p class="heartfelt-message">
                It's red coz its hot like youz 😉 ❤️
            </p>

        </div>

    </div>


    <script>

        /* =====================================================
           FLOATING HEARTS
        ===================================================== */

        function createHeart() {

            const heart = document.createElement('div');

            heart.classList.add('heart');

            heart.innerHTML = '❤️';

            heart.style.left =
                Math.random() * 100 + 'vw';

            heart.style.animationDuration =
                Math.random() * 3 + 4 + 's';

            heart.style.fontSize =
                Math.random() * 20 + 15 + 'px';

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 400);


        /* =====================================================
           CREATE 16 CANDLES
        ===================================================== */

        const candlesContainer =
            document.getElementById('candlesContainer');

        for (let i = 0; i < 16; i++) {

            const candle =
                document.createElement('span');

            candle.classList.add('candle');

            candle.innerHTML = '🕯️';

            candle.id = `candle-${i}`;

            candlesContainer.appendChild(candle);
        }


        /* =====================================================
           START EXPERIENCE
        ===================================================== */

        let audioContext;
        let analyser;
        let microphone;
        let microphoneStream;

        function startExperience() {

            document.getElementById('musicPrompt').style.display =
                'none';

            /* Start music */

            const music =
                document.getElementById('bgMusic');

            music.play().catch(error => {
                console.log(
                    "Audio couldn't play:",
                    error
                );
            });


            /* Start microphone */

            initAudioBlowing();
        }


        /* =====================================================
           MICROPHONE BLOW DETECTION
        ===================================================== */

        async function initAudioBlowing() {

            const status =
                document.getElementById('micStatus');

            try {

                microphoneStream =
                    await navigator.mediaDevices.getUserMedia({
                        audio: true
                    });

                audioContext =
                    new (
                        window.AudioContext ||
                        window.webkitAudioContext
                    )();

                analyser =
                    audioContext.createAnalyser();

                analyser.fftSize = 2048;

                microphone =
                    audioContext.createMediaStreamSource(
                        microphoneStream
                    );

                microphone.connect(analyser);

                status.innerText =
                    "💨 Blow on your phone now!";

                detectBlow();

            } catch (error) {

                console.error(
                    "Microphone error:",
                    error
                );

                status.innerText =
                    "Tap the message below if your microphone isn't available.";

                document
                    .getElementById('blowButton')
                    .onclick = simulateBlow;
            }
        }


        /* =====================================================
           DETECT BLOWING
        ===================================================== */

        let blowCooldown = false;

        function detectBlow() {

            if (candlesBlown) return;

            const bufferLength =
                analyser.fftSize;

            const dataArray =
                new Uint8Array(bufferLength);

            analyser.getByteTimeDomainData(
                dataArray
            );

            let sum = 0;

            for (
                let i = 0;
                i < bufferLength;
                i++
            ) {

                const value =
                    (dataArray[i] - 128) / 128;

                sum += value * value;
            }

            const volume =
                Math.sqrt(
                    sum / bufferLength
                );


            /*
             * Blow threshold.
             * Lower 0.12 if a gentle blow
             * isn't being detected.
             */

            if (
                volume > 0.12 &&
                !blowCooldown
            ) {

                blowCooldown = true;

                blowCandles();

                setTimeout(() => {
                    blowCooldown = false;
                }, 2000);
            }


            requestAnimationFrame(
                detectBlow
            );
        }


        /* =====================================================
           BLOW OUT CANDLES
        ===================================================== */

        let candlesBlown = false;

        function blowCandles() {

            if (candlesBlown) return;

            candlesBlown = true;


            /* Turn off candles one by one */

            for (
                let i = 0;
                i < 16;
                i++
            ) {

                setTimeout(() => {

                    const candle =
                        document.getElementById(
                            `candle-${i}`
                        );

                    if (candle) {
                        candle.classList.add(
                            'blown'
                        );
                    }

                }, i * 100);
            }


            document.getElementById(
                'blowButton'
            ).style.display = 'none';


            document.getElementById(
                'micStatus'
            ).innerText =
                "🔥 That's hot!";


            /* Confetti after candles go out */

            setTimeout(() => {

                createConfetti();

            }, 1800);


            /* Show gift */

            setTimeout(() => {

                const gift =
                    document.getElementById(
                        'giftSection'
                    );

                gift.style.display =
                    'block';

                gift.scrollIntoView({
                    behavior: 'smooth'
                });

            }, 2300);
        }


        /* =====================================================
           FALLBACK TAP
        ===================================================== */

        function simulateBlow() {

            blowCandles();

        }


        /* =====================================================
           CONFETTI
        ===================================================== */

        function createConfetti() {

            const colors = [
                '#ff4081',
                '#e91e63',
                '#ffeb3b',
                '#03a9f4',
                '#4caf50',
                '#9c27b0',
                '#ff9800',
                '#ffffff'
            ];


            for (
                let i = 0;
                i < 120;
                i++
            ) {

                const piece =
                    document.createElement(
                        'div'
                    );

                piece.classList.add(
                    'confetti'
                );

                piece.style.left =
                    Math.random() * 100 + 'vw';

                piece.style.backgroundColor =
                    colors[
                        Math.floor(
                            Math.random() *
                            colors.length
                        )
                    ];

                piece.style.animationDuration =
                    Math.random() * 3 + 2 + 's';

                piece.style.animationDelay =
                    Math.random() * 1.5 + 's';

                piece.style.width =
                    Math.random() * 8 + 6 + 'px';

                piece.style.height =
                    Math.random() * 12 + 8 + 'px';

                document.body.appendChild(
                    piece
                );


                setTimeout(() => {

                    piece.remove();

                }, 6000);
            }
        }


        /* =====================================================
           OPEN GIFT
        ===================================================== */

        function openGift() {

            const gift =
                document.getElementById(
                    'giftSection'
                );

            const surprise =
                document.getElementById(
                    'surpriseReveal'
                );


            gift.style.display = 'none';

            surprise.style.display =
                'block';


            surprise.scrollIntoView({
                behavior: 'smooth'
            });


            /* Extra confetti when gift opens */

            createConfetti();
        }

    </script>

</body>
</html>
